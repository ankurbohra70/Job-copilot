spring:
  application:
    name: job-copilot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_copilot}
    username: ${DB_USERNAME:job_copilot}
    password: ${DB_PASSWORD:job_copilot}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: false
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: ${RESUME_MAX_FILE_SIZE:5MB}
      max-request-size: ${RESUME_MAX_REQUEST_SIZE:6MB}
resume:
  processing:
    max-bytes: ${RESUME_MAX_BYTES:5242880}
    max-pages: ${RESUME_MAX_PAGES:25}
    max-characters: ${RESUME_MAX_CHARACTERS:200000}
    min-meaningful-characters: ${RESUME_MIN_MEANINGFUL_CHARACTERS:50}
job-intelligence:
  gemini:
    enabled: ${JOB_INTELLIGENCE_GEMINI_ENABLED:false}
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    connect-timeout: ${GEMINI_CONNECT_TIMEOUT:5s}
  openai:
    enabled: ${JOB_INTELLIGENCE_OPENAI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
job-discovery:
  scheduling:
    enabled: ${JOB_DISCOVERY_SCHEDULING_ENABLED:false}
    tick-interval: ${JOB_DISCOVERY_SCHEDULING_TICK_INTERVAL:1m}
    initial-delay: ${JOB_DISCOVERY_SCHEDULING_INITIAL_DELAY:30s}
    sync-cadence: ${JOB_DISCOVERY_SCHEDULING_SYNC_CADENCE:1h}
    concurrency: ${JOB_DISCOVERY_SCHEDULING_CONCURRENCY:2}
    lease-timeout: ${JOB_DISCOVERY_SCHEDULING_LEASE_TIMEOUT:5m}
    lease-heartbeat-interval: ${JOB_DISCOVERY_SCHEDULING_LEASE_HEARTBEAT_INTERVAL:30s}
  lever:
    connect-timeout: ${LEVER_CONNECT_TIMEOUT:5s}
    request-timeout: ${LEVER_REQUEST_TIMEOUT:20s}
    max-response-bytes: ${LEVER_MAX_RESPONSE_BYTES:10485760}
